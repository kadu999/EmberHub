# EmberHub 预置配置：RetroArch 便携模式 + 手柄自动识别
# 路径均为相对 exe 目录（便携模式），可直接随包分发

# 核心与信息
libretro_directory = "cores"
libretro_info_path = "info"
core_updater_check = "false"

# 手柄：自动加载 autoconfig 手柄档（覆盖常见手柄，插上即用）
joypad_autoconfig_dir = "autoconfig"
input_autodetect_enable = "true"
input_joypad_driver = "sdl2"
input_remapping_directory = "config/remaps"
# 呼出菜单的标准组合键：Start + Select（RetroArch 官方取值 4，0=None）
input_menu_toggle_gamepad_combo = "4"

# 界面 / 显示（Ozone 现代菜单，F1 呼出）
assets_directory = "assets"
menu_driver = "ozone"
video_fullscreen = "true"
video_windowed_fullscreen = "true"

# 声音
audio_enable = "true"
audio_driver = "wasapi"

# 存档
savefile_directory = "saves"
savestate_directory = "states"
system_directory = "system"
screenshot_directory = "screenshots"

# 退出时回写配置：玩家在模拟器里的改动会保留
config_save_on_exit = "true"
# 不绑定退出热键：Esc 不再误触退出（退出模拟器请直接结束进程）
input_exit_emulator = "nul"
