[package]
name = "emberhub"
version = "0.1.0"
description = "EmberHub - a modern emulator manager and frontend launcher"
authors = ["kadu999"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emberhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 本地 Kotlin 插件（Android Intent + FileProvider）作为工作区成员，共享 target/lockfile
[workspace]
members = ["plugins/android-intent"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-android-intent = { path = "plugins/android-intent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "stream", "rustls-tls"] }
roxmltree = "0.20"
url = "2"
percent-encoding = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.23"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
